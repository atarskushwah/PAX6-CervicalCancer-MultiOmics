<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}.panel{font-size:19px;font-weight:bold}.note{font-size:14px;fill:#555}</style><rect width="1440" height="1050" fill="white"/><text x="720" y="39" text-anchor="middle" font-size="26" font-weight="bold">PAX6 single-gene annotations and functional associations</text><g><text x="28" y="94" class="panel">A. GO biological process</text><line x1="295" y1="124" x2="295" y2="448" stroke="#888"/><text x="283" y="144" font-size="11" text-anchor="end">Enteroendocrine cell differentiation</text><line x1="295" x2="561.130089266057" y1="140" y2="140" stroke="#397fb0" stroke-width="2"/><circle cx="561.130089266057" cy="140" r="4" fill="#397fb0"/><text x="569.130089266057" y="144" font-size="10">4.5e-4</text><text x="283" y="176" font-size="11" text-anchor="end">Type B pancreatic cell differentiation</text><line x1="295" x2="554.2000752932288" y1="172" y2="172" stroke="#397fb0" stroke-width="2"/><circle cx="554.2000752932288" cy="172" r="4" fill="#397fb0"/><text x="562.2000752932288" y="176" font-size="10">5.5e-4</text><text x="283" y="208" font-size="11" text-anchor="end">Neuron fate commitment</text><line x1="295" x2="537.192764309644" y1="204" y2="204" stroke="#397fb0" stroke-width="2"/><circle cx="537.192764309644" cy="204" r="4" fill="#397fb0"/><text x="545.192764309644" y="208" font-size="10">9.0e-4</text><text x="283" y="240" font-size="11" text-anchor="end">Negative regulation of nervous-system development</text><line x1="295" x2="535.325592832453" y1="236" y2="236" stroke="#397fb0" stroke-width="2"/><circle cx="535.325592832453" cy="236" r="4" fill="#397fb0"/><text x="543.325592832453" y="240" font-size="10">9.5e-4</text><text x="283" y="272" font-size="11" text-anchor="end">Negative regulation of cell development</text><line x1="295" x2="528.7276416104357" y1="268" y2="268" stroke="#397fb0" stroke-width="2"/><circle cx="528.7276416104357" cy="268" r="4" fill="#397fb0"/><text x="536.7276416104357" y="272" font-size="10">1.1e-3</text><text x="283" y="304" font-size="11" text-anchor="end">Negative regulation of neurogenesis</text><line x1="295" x2="521.9343971629353" y1="300" y2="300" stroke="#397fb0" stroke-width="2"/><circle cx="521.9343971629353" cy="300" r="4" fill="#397fb0"/><text x="529.9343971629353" y="304" font-size="10">1.4e-3</text><text x="283" y="336" font-size="11" text-anchor="end">Epithelial cell development</text><line x1="295" x2="521.9343971629353" y1="332" y2="332" stroke="#397fb0" stroke-width="2"/><circle cx="521.9343971629353" cy="332" r="4" fill="#397fb0"/><text x="529.9343971629353" y="336" font-size="10">1.4e-3</text><text x="283" y="368" font-size="11" text-anchor="end">Visual system development</text><line x1="295" x2="507.931959695857" y1="364" y2="364" stroke="#397fb0" stroke-width="2"/><circle cx="507.931959695857" cy="364" r="4" fill="#397fb0"/><text x="515.931959695857" y="368" font-size="10">2.1e-3</text><text x="283" y="400" font-size="11" text-anchor="end">Positive regulation of miRNA transcription</text><line x1="295" x2="503.3205518638964" y1="396" y2="396" stroke="#397fb0" stroke-width="2"/><circle cx="503.3205518638964" cy="396" r="4" fill="#397fb0"/><text x="511.3205518638964" y="400" font-size="10">2.4e-3</text><text x="283" y="432" font-size="11" text-anchor="end">Positive regulation of miRNA metabolism</text><line x1="295" x2="499.2530018861528" y1="428" y2="428" stroke="#397fb0" stroke-width="2"/><circle cx="499.2530018861528" cy="428" r="4" fill="#397fb0"/><text x="507.2530018861528" y="432" font-size="10">2.7e-3</text><text x="295" y="470" font-size="11">−log₁₀(nominal p-value) →</text></g><g><text x="738" y="94" class="panel">B. GO molecular function</text><line x1="1005" y1="124" x2="1005" y2="448" stroke="#888"/><text x="993" y="144" font-size="11" text-anchor="end">Histone acetyltransferase binding</text><line x1="1005" x2="1239.85358963